name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Publish 0.3.0 packages
        run: |
          npm publish --workspace @gbesse/jev-runtime --access public
          npm publish --workspace @gbesse/jev-conformance --access public
          npm publish --workspace @gbesse/jev-context --access public
          npm publish --workspace @gbesse/jev-receipts --access public
          npm publish --workspace @gbesse/jev-vision --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
